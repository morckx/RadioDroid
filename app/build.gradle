apply plugin: 'com.android.application'
apply plugin: "de.undercouch.download"

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "de.undercouch:gradle-download-task:5.6.0"
    }
}


def getAvailableLocales() {
    def tree = fileTree(dir: 'src/main/res', include: '**/strings.xml')
    return tree.collect {
        def lang = it.getParentFile().getName() - "values-" - "values"

        // We want a name which would be understood by Locale::forLanguageTag, so we should do
        // do a simple conversion for an edge case:
        //   "pt-rBR" -> "pt-BR"
        //   "zh-rCN" -> "zh-CN"
        //   and so on
        lang = lang.replace("-r", "-")

        if (lang.empty) {
            lang = "en"
        }

        lang
    }
}

def gitHash = { ->
    try {
        def out = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
        }.standardOutput.asText.get().trim()
        return out.isEmpty() ? "No commit hash" : out
    } catch (Exception ignored) {
        return "No commit hash"
    }
}

def buildDate = { ->
    new Date().format('yyyy-MM-dd HH:mm:ss')
}

def appVersionName = "0.86.904-morckx"

android {
    flavorDimensions "one"
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
        resValues true
    }

    defaultConfig {
        applicationId "net.programmierecke.radiodroid2"
        minSdk 23
        targetSdk 37

        versionCode 100
        versionName appVersionName

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        // Define your application name here.
        // It must neither be present in /res/values/strings.xml
        // nor in /res/values/string_no_translate.xml
        resValue 'string', 'app_name_untranslated', 'RadioDroid'

        // Build metadata shown on the About screen (FragmentAbout). These do not
        // vary per variant, so they are injected here rather than via the (removed
        // in AGP 9) applicationVariants API.
        resValue 'string', 'GIT_HASH', gitHash()
        resValue 'string', 'BUILD_DATE', buildDate()

        // There is no easy way to get available locales during runtime, and especially before
        // tests setup.
        def escapedLocales = getAvailableLocales().collect { "\"" + it + "\"" }
        buildConfigField "String[]", "AVAILABLE_LOCALES", String.format("{ %s }", escapedLocales.join(","))

        testInstrumentationRunner "net.programmierecke.radiodroid2.tests.CustomTestRunner"

        // The following argument makes the Android Test Orchestrator run its
        // "pm clear" command after each test invocation. This command ensures
        // that the app's state is completely cleared between tests.
        testInstrumentationRunnerArguments clearPackageData: 'true'

        // buildConfigField "java.util.concurrent.atomic.AtomicBoolean", "IS_TESTING", "new java.util.concurrent.atomic.AtomicBoolean(false)"
        buildConfigField "boolean", "IS_TESTING", "false"

        multiDexKeepProguard file('multidex-config.pro')

        vectorDrawables.useSupportLibrary = true
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    sourceSets {
        androidTest {
            resources.srcDirs += ['src/androidTest/resources']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'

            lintOptions {
                disable 'MissingTranslation'
            }
        }
    }
    productFlavors {
        play {
            dimension "one"
        }
        free {
            dimension "one"
        }
    }
    lint {
        abortOnError true
        disable 'UnsafeOptInUsageError'
    }
    namespace 'net.programmierecke.radiodroid2'

    testOptions {
        unitTests.all {
            // Tests use JUnit 5 (jupiter); the vintage engine on the classpath keeps
            // any JUnit 4 tests running. useJUnit() (JUnit 4 only) cannot discover
            // jupiter tests, which fails under Gradle 9's failOnNoDiscoveredTests.
            useJUnitPlatform()
        }
        animationsDisabled = true
        unitTests.returnDefaultValues = true
    }

    task renewFallbackStations(type: Download) {
        group 'Build Setup'
        description 'Renews the list of some popular and recently checked fallback stations'
        src 'https://de1.api.radio-browser.info/json/stations/search?limit=10&bitrateMax=128&hidebroken=true&has_extended_info=true&order=lastchecktime&reverse=true&bitrateMax=128'
        dest new File("app/src/main/res/raw", "fallback_stations.json")
        overwrite true
        tempAndMove true
    }
}

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of("17"))
    }
}

ext {
    media3Version = '1.11.0'
    iconicsVersion = '5.6.0'
    glideVersion = '5.0.9'
}

configurations.configureEach {
    // Keep the legacy hamcrest-core:1.3 (pulled in transitively by junit:junit and
    // the androidx.test artifacts) off the classpath. Its org.hamcrest.core.AllOf
    // lacks the allOf(Matcher, Matcher) overload Espresso 3.6 calls and, when
    // packaged into the test APK, shadows the modern org.hamcrest:hamcrest:2.2,
    // causing NoSuchMethodError in every Espresso test. See #243 upgrade work.
    exclude group: 'org.hamcrest', module: 'hamcrest-core'
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.tvprovider:tvprovider:1.1.0'
    implementation 'androidx.tracing:tracing:2.0.1'

    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    implementation "com.github.bumptech.glide:okhttp3-integration:$glideVersion"
    annotationProcessor "com.github.bumptech.glide:compiler:$glideVersion"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "com.mikepenz:iconics-core:$iconicsVersion"
    implementation "com.mikepenz:iconics-views:$iconicsVersion"
    implementation 'com.mikepenz:google-material-typeface:3.0.1.4.original-kotlin@aar'
    //noinspection NewerVersionAvailable - this is the last version that contains some icons we use
    implementation 'com.mikepenz:community-material-typeface:5.0.45.1-kotlin@aar'
    implementation 'com.github.rustamg:file-dialogs:1.0'
    implementation 'info.debatty:java-string-similarity:2.0.0'
    implementation 'me.xdrop:fuzzywuzzy:1.4.0'
    implementation 'com.github.zawadz88:MaterialPopupMenu:3.4.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.3.0'

    implementation 'androidx.room:room-runtime:2.7.2'
    androidTestImplementation("androidx.test.espresso:espresso-contrib:3.6.1") {
        exclude group: 'org.checkerframework', module: 'checker'
    }
    annotationProcessor 'androidx.room:room-compiler:2.7.2'

    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1"

    implementation 'androidx.paging:paging-runtime-ktx:3.3.6'

    playImplementation 'com.google.android.gms:play-services-cast:22.3.1'
    playImplementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    playImplementation 'com.google.android.gms:play-services-safetynet:18.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.3'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.13.3'
    // Required on the test runtime classpath by Gradle 9's useJUnitPlatform().
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.3'

    // Espresso 3.6 calls org.hamcrest.core.AllOf.allOf(Matcher, Matcher), which only
    // exists in Hamcrest 2.x. androidx.test artifacts drag in the legacy
    // hamcrest-core:1.3, whose AllOf class shadows 2.2 in the packaged test APK and
    // causes NoSuchMethodError at runtime. Force the modern, unified Hamcrest.
    androidTestImplementation 'org.hamcrest:hamcrest:2.2'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'

    androidTestImplementation("com.squareup.okhttp3:mockwebserver:5.5.0")
    androidTestImplementation("com.github.YarikSOffice:lingver:1.3.0")
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
}


// https://stackoverflow.com/questions/24649240/build-release-apk-with-customize-name-format-in-android-studio
// https://stackoverflow.com/questions/32092665/resolve-application-label-for-each-build-type/32220436#32220436
// https://stackoverflow.com/questions/18332474/how-to-set-versionname-in-apk-filename-using-gradle

// Gradle 3.0
// https://stackoverflow.com/questions/44800028/change-apk-filename-in-gradle-failed-with-gradle3-0-0-alpha4

// Rename the output APKs to include the app name, flavor, build type, version
// and git hash. The legacy `android.applicationVariants` / `outputFileName` API
// was removed in AGP 9, so this uses the current AndroidComponents variant API.
androidComponents {
    onVariants(selector().all()) { variant ->
        def appName = "RadioDroid"
        variant.productFlavors.each { flavor ->
            // productFlavors entries are (dimension, name) pairs
            appName += "-${flavor.second}"
        }
        appName += "-${variant.buildType}"
        if (variant.buildType == "debug") {
            appName += "-DEV"
        }
        if (!appVersionName.isEmpty()) {
            appName += "-" + appVersionName
        }
        appName += "-" + gitHash() + ".apk"

        variant.outputs.each { output ->
            output.outputFileName.set(appName)
        }
    }
}

